# Local development only. Production runs on the shared VPS Postgres (docs/operations.md).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: spending
      POSTGRES_PASSWORD: spending
      POSTGRES_DB: spending
    ports:
      - '127.0.0.1:55440:5432'
    volumes:
      - spending-pgdata:/var/lib/postgresql
      - ./apps/api/test/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spending -d spending']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  spending-pgdata:
