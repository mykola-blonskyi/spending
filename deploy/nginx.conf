# Static file server and /api proxy behind Traefik. Runs as the unprivileged nginx user, so
# every writable path lives in /tmp and the listener is on 8080.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
    text/javascript mjs;
  }
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  access_log /dev/stdout combined;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

  # Traefik already sets X-Forwarded-Proto; fall back to our own scheme when it is absent.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  # Docker's embedded DNS. Resolving per request keeps the proxy working after Coolify
  # recreates the api container with a new IP while web keeps running.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/security-headers.conf;

    location /api/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;

      set $api_upstream spending-api:3000;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_hide_header X-Powered-By;
      proxy_read_timeout 60s;
      proxy_request_buffering off;
      client_max_body_size 3m;
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location ~ \.map$ {
      return 404;
    }

    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }
  }
}
