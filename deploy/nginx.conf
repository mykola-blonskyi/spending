# Static file server and /api proxy behind Traefik. Runs as the unprivileged nginx user, so
# every writable path lives in /tmp and the listener is on 8080.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
    text/javascript mjs;
  }
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Invitation tokens are bearer secrets: keep them out of the access log (path, returnTo value;
  # no Referer, which carries /invite/<token>). The error log still names the request line when
  # an upstream fails.
  map $request_uri $log_uri_path {
    "~^(?<head>/(?:invite|api/v1/invitations)/)[^/?]+(?<tail>.*)$" "${head}[redacted]${tail}";
    default $request_uri;
  }
  map $log_uri_path $log_uri {
    "~^(?<head>.*[?&]returnTo=)[^&]*(?<tail>.*)$" "${head}[redacted]${tail}";
    default $log_uri_path;
  }
  log_format redacted '$remote_addr - $remote_user [$time_local] "$request_method $log_uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent"';
  access_log /dev/stdout redacted;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

  # Traefik already sets X-Forwarded-Proto; fall back to our own scheme when it is absent.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  # Real client address. The chain is Cloudflare -> Traefik -> nginx. Only Traefik (a private
  # address) reaches this container; it rewrites X-Forwarded-For to its own peer, which is a
  # Cloudflare edge for proxied traffic or the client itself when someone bypasses Cloudflare.
  # Trusting X-Forwarded-For from private ranges recovers that peer as $remote_addr. Only when the
  # peer is a Cloudflare edge is CF-Connecting-IP believed, so a direct request cannot spoof it.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.0/8;
  set_real_ip_from fd00::/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  geo $remote_addr $from_cloudflare {
    default 0;
    include /etc/nginx/cloudflare-ips.conf;
  }

  map "$from_cloudflare:$http_cf_connecting_ip" $client_ip {
    default $remote_addr;
    "~^1:(?<cf_client>[0-9A-Fa-f:.]+)$" $cf_client;
  }

  # Docker's embedded DNS. Resolving per request keeps the proxy working after Coolify
  # recreates the api container with a new IP while web keeps running.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/security-headers.conf;

    location /api/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;

      set $api_upstream spending-api:3000;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Real-IP $client_ip;
      proxy_hide_header X-Powered-By;
      proxy_read_timeout 60s;
      proxy_request_buffering off;
      client_max_body_size 3m;
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location ~ \.map$ {
      return 404;
    }

    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }
  }
}
