# Local smoke test of the production stack. Not used by Coolify.
#
#   docker compose --env-file deploy/smoke.env -f docker-compose.yml \
#     -f deploy/docker-compose.smoke.yml up -d --build --wait
#   docker compose --env-file deploy/smoke.env -f docker-compose.yml \
#     -f deploy/docker-compose.smoke.yml down -v
#
# Adds a throwaway Postgres 18 and publishes web on 127.0.0.1:18080.

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: spending_app
      POSTGRES_PASSWORD: smoke
      POSTGRES_DB: spending
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spending_app -d spending']
      interval: 2s
      timeout: 3s
      retries: 30

  predeploy-backup:
    depends_on:
      postgres:
        condition: service_healthy

  spending-api:
    environment:
      # Stands in for the SOURCE_COMMIT that Coolify's env_file provides in production.
      SOURCE_COMMIT: smoke-commit-1234

  backup:
    depends_on:
      postgres:
        condition: service_healthy

  web:
    ports:
      - '127.0.0.1:18080:8080'
