name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit to verify
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CHECKOUT_REF: ${{ inputs.ref || github.sha }}

jobs:
  static:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @spending/api db:check
      - name: OpenAPI document and client types are current
        run: |
          pnpm openapi
          git status --porcelain -- apps/web/src/data
          test -z "$(git status --porcelain -- apps/web/src/data)"
      - name: Deploy script tests
        run: sh scripts/coolify-deploy.test.sh

  unit:
    name: Unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: spending
          POSTGRES_PASSWORD: spending
          POSTGRES_DB: spending_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U spending -d spending_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://spending:spending@localhost:5432/spending_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: spending
          POSTGRES_PASSWORD: spending
          POSTGRES_DB: spending_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U spending -d spending_e2e"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://spending:spending@localhost:5432/spending_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spending/web exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - name: Build and start the production stack
        run: |
          docker compose --env-file deploy/smoke.env -f docker-compose.yml \
            -f deploy/docker-compose.smoke.yml up -d --build --wait web
          docker compose --env-file deploy/smoke.env -f docker-compose.yml \
            -f deploy/docker-compose.smoke.yml up -d backup
      - run: APP_URL=http://127.0.0.1:18080 EXPECTED_VERSION=smoke-commit-1234 sh scripts/check-deploy.sh
      - name: Web logs hold no invitation token or callback code
        run: |
          compose="docker compose --env-file deploy/smoke.env -f docker-compose.yml -f deploy/docker-compose.smoke.yml"
          curl -s -o /dev/null 'http://127.0.0.1:18080/invite/SECRETTOKEN?returnTo=%2Finvite%2FSECRETTOKEN'
          curl -s -o /dev/null -X POST 'http://127.0.0.1:18080/api/v1/invitations/SECRETTOKEN/accept'
          curl -s -o /dev/null 'http://127.0.0.1:18080/api/v1/auth/callback?code=SECRETTOKEN&state=SECRETTOKEN'
          $compose logs --no-color web | grep -c 'GET /invite/\[redacted\]'
          test "$($compose logs --no-color web | grep -c SECRETTOKEN)" = 0
      - name: Backup container dumps and has rclone
        run: |
          compose="docker compose --env-file deploy/smoke.env -f docker-compose.yml -f deploy/docker-compose.smoke.yml"
          $compose exec -T backup /usr/local/bin/backup.sh daily
          $compose exec -T backup rclone version
      - if: failure()
        run: |
          docker compose --env-file deploy/smoke.env -f docker-compose.yml \
            -f deploy/docker-compose.smoke.yml logs --no-color --tail=100
      - if: always()
        run: |
          docker compose --env-file deploy/smoke.env -f docker-compose.yml \
            -f deploy/docker-compose.smoke.yml down -v
