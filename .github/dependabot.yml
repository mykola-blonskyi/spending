version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    # Major versions are deliberate migrations, done by hand.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Even minors are nginx stable, odd minors mainline. Move stable by hand (1.30 -> 1.32).
      - dependency-name: nginx
        versions: ['>=1.31']
    groups:
      docker:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Major versions are deliberate migrations, done by hand.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']
