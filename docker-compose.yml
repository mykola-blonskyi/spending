# Production stack, built and run by Coolify (docs/decisions.md ADR-004, docs/operations.md).
#
# Coolify resource settings:
# - Build pack Docker Compose, this repository, branch main, auto-deploy on push off. Only
#   .github/workflows/deploy.yml deploys.
# - "Connect to Predefined Network" on. It is how migrate, api and the backups reach the shared
#   Postgres at 3p9qjnulllqn3bcjqokir0wq:5432 (the container name, never the `postgres` alias).
#   There is no `networks:` block here on purpose; Coolify manages the stack network.
# - A domain only on `web`, port 8080. Every other service stays private.
#
# Every ${VAR:?} comes from Coolify's per-resource environment panel. `:?` makes a missing
# entry fail the deploy instead of starting a container with an empty value.
#
# Every service runs as a non-root user and needs no Linux capability (web listens on 8080), so
# each drops them all and cannot gain privileges (docs/operations.md, Container hardening).
#
# Start order on every deploy: predeploy-backup (pg_dump) → migrate → api (healthy) → web.
# `docker compose up` stops at the first step that fails, so migrations never run without a
# fresh dump and the new api never starts against an unmigrated schema. The one-shot services
# use `restart: "no"`, which also keeps their exited state out of Coolify's health status.

services:
  predeploy-backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    command: ['pre-migrate']
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
    volumes:
      - spending-backups:/backups
    restart: 'no'

  migrate:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    command: ['node', 'dist/database/migrate.js']
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      NODE_ENV: production
    depends_on:
      predeploy-backup:
        condition: service_completed_successfully
    restart: 'no'

  spending-api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      APP_ORIGIN: ${APP_ORIGIN:?}
      OIDC_ISSUER: ${OIDC_ISSUER:?}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?}
      # No SOURCE_COMMIT here: any ${SOURCE_COMMIT} reference makes Coolify store it as a user
      # variable, which then replaces the real commit. Coolify's env_file already gives the
      # container SOURCE_COMMIT, and /api/health reports it for the deploy check.
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    depends_on:
      spending-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    command: ['schedule']
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      # Optional off-host copy, off unless BACKUP_OFFSITE_REMOTE is set (docs/operations.md).
      BACKUP_OFFSITE_REMOTE: ${BACKUP_OFFSITE_REMOTE:-}
      RCLONE_S3_PROVIDER: ${RCLONE_S3_PROVIDER:-}
      RCLONE_S3_ENDPOINT: ${RCLONE_S3_ENDPOINT:-}
      RCLONE_S3_REGION: ${RCLONE_S3_REGION:-}
      RCLONE_S3_ACCESS_KEY_ID: ${RCLONE_S3_ACCESS_KEY_ID:-}
      RCLONE_S3_SECRET_ACCESS_KEY: ${RCLONE_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - spending-backups:/backups
    restart: unless-stopped

volumes:
  spending-backups:
